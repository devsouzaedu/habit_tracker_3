<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0f">
    <meta name="description" content="Mensuremi — Evolua e mensure sua vida com IA. Entre na lista de espera.">
    <title>Mensuremi - Lista de Espera</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" href="/public/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b0f;
            --bg1: #131318;
            --bg2: #1a1a22;
            --red: #e6002a;
            --red-d: #b30021;
            --grn: #00e676;
            --t1: #ededf0;
            --t2: #94949f;
            --t3: #5a5a67;
            --brd: #2a2a35;
            --brd-h: #3a3a48;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(230, 0, 42, 0.18), transparent 70%);
            color: var(--t1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--bg1);
            border: 1px solid var(--brd);
            border-radius: 16px;
            padding: 40px 32px;
        }

        .brand { text-align: center; margin-bottom: 28px }

        .logo {
            display: block;
            margin: 0 auto 18px;
            width: 64px;
            height: 64px;
            border-radius: 14px;
            object-fit: cover;
            box-shadow: 0 4px 16px rgba(230, 0, 42, 0.35);
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--red);
            background: rgba(230, 0, 42, 0.1);
            border: 1px solid rgba(230, 0, 42, 0.3);
            border-radius: 999px;
            padding: 4px 10px;
            margin-bottom: 14px;
        }

        h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em }

        .tagline { margin-top: 8px; color: var(--t2); font-size: 0.95rem; line-height: 1.5 }

        form { display: flex; flex-direction: column; gap: 8px }

        label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--t2);
            margin-top: 8px;
        }

        .field {
            display: flex;
            align-items: center;
            background: var(--bg2);
            border: 1px solid var(--brd);
            border-radius: 8px;
            transition: border-color .2s;
        }

        .field:focus-within { border-color: var(--red) }

        .field .prefix { padding-left: 14px; color: var(--t3); font-weight: 500 }

        .field input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--t1);
            font: inherit;
            font-size: 0.95rem;
            padding: 12px 14px;
        }

        .field .prefix + input { padding-left: 4px }

        .field input::placeholder { color: var(--t3) }

        button {
            margin-top: 16px;
            padding: 13px 22px;
            background: var(--red);
            border: none;
            border-radius: 8px;
            color: #fff;
            font: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s, opacity .2s;
        }

        button:hover { background: var(--red-d) }
        button:disabled { opacity: .6; cursor: wait }

        .msg { min-height: 1.2em; font-size: 0.85rem; text-align: center; margin-top: 6px; color: #ff3b4f }

        .success { display: none; text-align: center }
        .success.show { display: block }
        .success .check {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(0, 230, 118, 0.12);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: var(--grn);
            font-size: 1.6rem;
        }
        .success h2 { font-size: 1.2rem; font-weight: 700 }
        .success p { margin-top: 8px; color: var(--t2); line-height: 1.5 }

        footer { margin-top: 24px; font-size: 0.8rem; color: var(--t3); text-align: center }
        footer .credits { margin-top: 10px }
        footer a { color: var(--t3) }
        footer a:hover { color: var(--t2) }

        @media (max-width: 420px) {
            .card { padding: 32px 20px }
            h1 { font-size: 1.5rem }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="brand">
            <img src="/public/images/logo.png" alt="Mensuremi" class="logo">
            <span class="badge">Em breve</span>
            <h1>Mensuremi</h1>
            <p class="tagline">Evolua e mensure sua vida com IA.<br>Entre na lista de espera e seja um dos primeiros a acessar.</p>
        </div>

        <form id="waitlist-form" novalidate>
            <label for="wl-instagram">Instagram</label>
            <div class="field">
                <span class="prefix">@</span>
                <input type="text" id="wl-instagram" name="instagram" placeholder="seuperfil" autocomplete="off"
                    autocapitalize="none" spellcheck="false" maxlength="31" required>
            </div>

            <label for="wl-email">Email</label>
            <div class="field">
                <input type="email" id="wl-email" name="email" placeholder="seu@email.com" autocomplete="email" required>
            </div>

            <button type="submit" id="wl-btn">Entrar na lista de espera</button>
            <p id="wl-msg" class="msg" role="alert"></p>
        </form>

        <div id="wl-success" class="success" aria-live="polite">
            <div class="check">✓</div>
            <h2>Você está na lista!</h2>
            <p>Vamos avisar por email e pelo Instagram assim que o Mensuremi abrir.</p>
        </div>
    </main>

    <footer>
        <p>Já tem acesso? <a href="/app">Entrar</a></p>
        <p class="credits">Por <a href="https://instagram.com/inquebrantavel7" target="_blank" rel="noopener">@inquebrantavel7</a> &amp; A&amp;L Technologies, 2026 - 2030.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script>
        (function () {
            const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: { persistSession: false }
            });

            const form = document.getElementById('waitlist-form');
            const igInput = document.getElementById('wl-instagram');
            const emailInput = document.getElementById('wl-email');
            const btn = document.getElementById('wl-btn');
            const msg = document.getElementById('wl-msg');
            const success = document.getElementById('wl-success');

            const IG_RE = /^[a-z0-9._]{1,30}$/;
            const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

            // Aceita "@perfil", "perfil" ou link do perfil
            function normalizeInstagram(value) {
                return value.trim()
                    .replace(/^https?:\/\/(www\.)?instagram\.com\//i, '')
                    .replace(/[/?#].*$/, '')
                    .replace(/^@+/, '')
                    .toLowerCase();
            }

            function showSuccess() {
                form.style.display = 'none';
                success.classList.add('show');
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                msg.textContent = '';

                const instagram = normalizeInstagram(igInput.value);
                const email = emailInput.value.trim().toLowerCase();

                if (!IG_RE.test(instagram)) {
                    msg.textContent = 'Informe um @ do Instagram válido.';
                    igInput.focus();
                    return;
                }
                if (!EMAIL_RE.test(email) || email.length > 254) {
                    msg.textContent = 'Informe um email válido.';
                    emailInput.focus();
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Enviando...';

                const { error } = await sb.from('waitlist').insert({ email, instagram });

                btn.disabled = false;
                btn.textContent = 'Entrar na lista de espera';

                if (!error || error.code === '23505') {
                    // 23505 = email já cadastrado: trata como sucesso
                    showSuccess();
                    return;
                }

                console.error('Waitlist error:', error);
                msg.textContent = 'Não foi possível entrar na lista agora. Tente novamente.';
            });
        })();
    </script>
</body>

</html>
